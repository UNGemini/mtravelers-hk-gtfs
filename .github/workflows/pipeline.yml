name: GTFS Data Pipeline

on:
  schedule:
    # Weekly run: Sunday 03:00 HKT (Saturday 19:00 UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch:

# Avoid overlapping scheduled/manual runs on the same branch.
concurrency:
  group: gtfs-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 360

    # App expects PostgreSQL (PostGIS preferred). SQLite is not supported for
    # the spatial tables / SQL dialect used by this pipeline.
    services:
      db:
        image: postgis/postgis:13-3.1
        env:
          POSTGRES_DB: gtfs_hk
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d gtfs_hk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libexpat1 \
            mdbtools \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libspatialindex-dev \
            wget \
            zip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Decoupled restore/save: save-always on actions/cache@v4 is deprecated
      # and does not persist on job failure. restore + save with if: always()
      # keeps partial .cache / waypoints after mid-run crashes (gov rate limits).
      - name: Restore mtravelers data cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            waypoints
          # Unique primary key per run/attempt so cache/save never collides with
          # an existing key (save fails if the key already exists).
          key: mtravelers-gtfs-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mtravelers-gtfs-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-
            mtravelers-gtfs-cache-${{ runner.os }}-

      - name: Scrape & Generate GTFS
        run: python main.py
        env:
          # Match docker-compose credentials; host is the GHA service port map.
          DATABASE_URL: postgresql://user:password@localhost:5432/gtfs_hk

      - name: Stage public artifacts
        run: |
          set -euo pipefail
          mkdir -p public

          if [ ! -f output/hk.gtfs.zip ]; then
            echo "ERROR: expected GTFS zip at output/hk.gtfs.zip"
            ls -la output || true
            exit 1
          fi

          cp output/hk.gtfs.zip public/hk.gtfs.zip
          ls -lah public/hk.gtfs.zip

          # Optional dense compiler (only if checked into the repo).
          if [ -x compiler/gtfs-dense-compiler ]; then
            ./compiler/gtfs-dense-compiler public/hk.gtfs.zip public/mtravelers-graph.dense
          else
            echo "Dense compiler not present at compiler/gtfs-dense-compiler; skipping."
          fi

      - name: Fetch Latest HK PMTiles Map Data
        continue-on-error: true
        run: |
          mkdir -p public
          wget -q --show-progress \
            https://github.com/UNGemini/hk-pmtiles-generation/releases/latest/download/hongkong.pmtiles \
            -O public/hongkong.pmtiles

      - name: Verify PMTiles File
        run: |
          if [ ! -f public/hongkong.pmtiles ]; then
            echo "Warning: hongkong.pmtiles missing, using fallback vector data if available."
          fi

      - name: Generate Security Headers
        run: |
          cat > public/_headers << 'EOF'
          /*
            Cross-Origin-Embedder-Policy: require-corp
            Cross-Origin-Opener-Policy: same-origin
            Access-Control-Allow-Origin: *
          EOF

      - name: Upload GTFS artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: hk.gtfs.zip
          path: output/hk.gtfs.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Configure AWS CLI for Cloudflare R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Sync Public Directory to Cloudflare R2
        run: |
          aws s3 sync public/ s3://hk-routing-data/ \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --delete

      # Always last: upload whatever main.py managed to download before failing.
      - name: Save mtravelers data cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            waypoints
          key: mtravelers-gtfs-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
