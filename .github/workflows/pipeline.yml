name: GTFS Data Pipeline

on:
  schedule:
    # Weekly run: Sunday 03:00 HKT (Saturday 19:00 UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch:

# Avoid overlapping scheduled/manual runs on the same branch.
concurrency:
  group: gtfs-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 360

    # App expects PostgreSQL (PostGIS preferred). SQLite is not supported for
    # the spatial tables / SQL dialect used by this pipeline.
    services:
      db:
        image: postgis/postgis:13-3.1
        env:
          POSTGRES_DB: gtfs_hk
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d gtfs_hk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libexpat1 \
            mdbtools \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libspatialindex-dev \
            capnproto \
            wget \
            zip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Decoupled restore/save: save-always on actions/cache@v4 is deprecated
      # and does not persist on job failure. restore + save with if: always()
      # keeps partial .cache / waypoints after mid-run crashes (gov rate limits).
      - name: Restore mtravelers data cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            waypoints
          # Unique primary key per run/attempt so cache/save never collides with
          # an existing key (save fails if the key already exists).
          key: mtravelers-gtfs-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mtravelers-gtfs-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-
            mtravelers-gtfs-cache-${{ runner.os }}-

      - name: Scrape & Generate GTFS
        run: python main.py
        env:
          # Match docker-compose credentials; host is the GHA service port map.
          DATABASE_URL: postgresql://user:password@localhost:5432/gtfs_hk

      - name: Stage public artifacts
        run: |
          set -euo pipefail
          mkdir -p public

          if [ ! -f output/hk.gtfs.zip ]; then
            echo "ERROR: expected GTFS zip at output/hk.gtfs.zip"
            ls -la output || true
            exit 1
          fi

          cp output/hk.gtfs.zip public/hk.gtfs.zip
          ls -lah public/hk.gtfs.zip

          # Optional dense compiler (only if checked into the repo).
          if [ -x compiler/gtfs-dense-compiler ]; then
            ./compiler/gtfs-dense-compiler public/hk.gtfs.zip public/mtravelers-graph.dense
          else
            echo "Dense compiler not present at compiler/gtfs-dense-compiler; skipping."
          fi

      # ── Build routing graph (.wheelsrouter) from the fresh GTFS ─────────
      # The trip-planning app (MorganTraveler) loads hk.wheelsrouter(.gz)
      # from this same R2 bucket. Build it from the GTFS produced by this
      # run so the graph always matches the feed just published.
      - name: Checkout local-router (pipeline-rs)
        uses: actions/checkout@v4
        with:
          repository: UNGemini/local-router
          ref: ${{ vars.LOCAL_ROUTER_REF || 'main' }}
          path: local-router
          fetch-depth: 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-router

      - name: Build pipeline binary
        working-directory: local-router
        run: cargo build --release -p pipeline-rs

      # ── NEW: OSM street network for the local road engine ───────────────
      # Same source hk-pmtiles-generation uses, so graph and basemap agree.
      - name: Download HK OSM extract
        run: |
          mkdir -p output
          wget -q --show-progress \
            https://download.geofabrik.de/asia/china/hong-kong-latest.osm.pbf \
            -O output/hong-kong.osm.pbf
          ls -lah output/hong-kong.osm.pbf

      - name: Build routing graph
        env:
          PIPELINE: local-router/target/release/pipeline
        run: |
          set -euo pipefail
          "${PIPELINE}" --gtfs output/hk.gtfs.zip --osm output/hong-kong.osm.pbf -o public/hk.wheelsrouter
          gzip -k -f public/hk.wheelsrouter
          ls -lah public/hk.wheelsrouter public/hk.wheelsrouter.gz

      # Smoke test — Residents' services (NR/DB) must survive the build; the
      # app depends on them. The graph is a string-interning binary, so grep
      # needs -a. Failing here aborts the job before R2 sync, keeping the
      # last good graph published.
      - name: Smoke-test graph for RBS routes
        run: |
          set -euo pipefail
          if ! grep -aq "NR332" public/hk.wheelsrouter; then
            echo "::error::NR332 not found in built graph — RBS trips missing from GTFS?" >&2
            exit 1
          fi
          echo "NR332 present in graph ✓"

      - name: Fetch Latest HK PMTiles Map Data
        continue-on-error: true
        run: |
          mkdir -p public
          wget -q --show-progress \
            https://github.com/UNGemini/hk-pmtiles-generation/releases/latest/download/hongkong.pmtiles \
            -O public/hongkong.pmtiles

      - name: Verify PMTiles File
        run: |
          if [ ! -f public/hongkong.pmtiles ]; then
            echo "Warning: hongkong.pmtiles missing, using fallback vector data if available."
          fi

      - name: Generate Security Headers
        run: |
          cat > public/_headers << 'EOF'
          /*
            Cross-Origin-Embedder-Policy: require-corp
            Cross-Origin-Opener-Policy: same-origin
            Access-Control-Allow-Origin: *
          EOF

      - name: Upload GTFS artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: hk.gtfs.zip
          path: output/hk.gtfs.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Sync Public Directory to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 sync public/ s3://hk-routing-data/ \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --delete

      # Graph files get long cache headers so the CDN edge serves the
      # weekly build for a day and revalidates for a week beyond that.
      - name: Set graph cache headers on R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          for f in hk.wheelsrouter hk.wheelsrouter.gz; do
            aws s3 cp "public/${f}" "s3://hk-routing-data/${f}" \
              --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
              --cache-control "public, max-age=86400, stale-while-revalidate=604800"
          done

      # Always last: upload whatever main.py managed to download before failing.
      - name: Save mtravelers data cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            waypoints
          key: mtravelers-gtfs-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
