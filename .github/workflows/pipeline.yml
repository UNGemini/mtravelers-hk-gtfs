name: GTFS Data Pipeline

on:
  schedule:
    # Weekly run: Sunday 03:00 HKT (Saturday 19:00 UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch:

# Avoid overlapping scheduled/manual runs on the same branch.
concurrency:
  group: gtfs-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # App expects PostgreSQL (PostGIS preferred). SQLite is not supported for
    # the spatial tables / SQL dialect used by this pipeline.
    services:
      db:
        image: postgis/postgis:13-3.1
        env:
          POSTGRES_DB: gtfs_hk
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d gtfs_hk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libexpat1 \
            mdbtools \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libspatialindex-dev \
            wget \
            zip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Persist partial .cache even if main.py fails mid-run so the next
      # workflow can resume downloads instead of starting from scratch.
      - name: Cache mtravelers data
        uses: actions/cache@v4
        with:
          path: |
            .cache
            waypoints
          # Stable key: do not hash source files, or every code fix busts the
          # partial download cache that main.py relies on for resume.
          key: mtravelers-gtfs-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            mtravelers-gtfs-cache-${{ runner.os }}-
          save-always: true

      - name: Scrape & Generate GTFS
        run: python main.py
        env:
          # Match docker-compose credentials; host is the GHA service port map.
          DATABASE_URL: postgresql://user:password@localhost:5432/gtfs_hk

      - name: Stage public artifacts
        run: |
          set -euo pipefail
          mkdir -p public

          if [ ! -f output/hk.gtfs.zip ]; then
            echo "ERROR: expected GTFS zip at output/hk.gtfs.zip"
            ls -la output || true
            exit 1
          fi

          cp output/hk.gtfs.zip public/hk.gtfs.zip
          ls -lah public/hk.gtfs.zip

          # Optional dense compiler (only if checked into the repo).
          if [ -x compiler/gtfs-dense-compiler ]; then
            ./compiler/gtfs-dense-compiler public/hk.gtfs.zip public/mtravelers-graph.dense
          else
            echo "Dense compiler not present at compiler/gtfs-dense-compiler; skipping."
          fi

      - name: Fetch Latest HK PMTiles Map Data
        continue-on-error: true
        run: |
          wget -q --show-progress \
            https://github.com/wheelstransit/hk-pmtiles-generation/releases/latest/download/hongkong.pmtiles \
            -O public/hongkong.pmtiles

      - name: Generate Security Headers
        run: |
          cat > public/_headers << 'EOF'
          /*
            Cross-Origin-Embedder-Policy: require-corp
            Cross-Origin-Opener-Policy: same-origin
            Access-Control-Allow-Origin: *
          EOF

      - name: Upload GTFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hk.gtfs.zip
          path: output/hk.gtfs.zip
          retention-days: 90

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: hk-routing-data
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
